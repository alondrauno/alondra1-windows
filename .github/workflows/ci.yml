name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: {}  # the release workflow runs every check first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Alondra1.slnx
      - run: dotnet build Alondra1.slnx -c Release --no-restore
      # Includes ContractSchemaTests, which keep contract/schemas and contract/fixtures in step with the model.
      - run: dotnet test Alondra1.slnx -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  environments:
    # Both builds (completion spec v1.1 §8.2): each must contain only its own environment's endpoints.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish prod and dev
        shell: pwsh
        run: |
          dotnet publish src/Alondra1.App/Alondra1.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Alondra1Environment=prod -o out/prod
          dotnet publish src/Alondra1.App/Alondra1.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Alondra1Environment=dev -o out/dev
      - name: No endpoint of the other environment
        shell: pwsh
        run: |
          ./scripts/check-environment.ps1 -Environment prod -Path out/prod
          ./scripts/check-environment.ps1 -Environment dev -Path out/dev

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
