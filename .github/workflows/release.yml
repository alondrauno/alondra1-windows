name: release

# Two builds from one commit (completion spec v1.1 §8.2, §10):
#   - every push to main: a clearly dev-only setup (Alondra1 Dev: own AppId, data folder, dev endpoints), as a
#     workflow artifact and on the rolling "dev-latest" prerelease (public Dev download, owner decision 2026-11-26).
#   - tag vX.Y.Z (matching MyAppVersion): the prod setup is built and checked, then waits for the reviewers of the
#     "prod" environment. Only the approved job gets the signing identity, signs exactly that build (its SHA-256 is
#     checked first), verifies the signature and publishes the GitHub release with the checksum. A tag alone publishes
#     nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  dev-setup:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # the dev-latest prerelease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Build the dev setup
        shell: pwsh
        run: |
          ./installer/publish.ps1 -Environment dev
          (Get-FileHash artifacts/Alondra1-dev-setup.exe -Algorithm SHA256).Hash.ToLower() + "  Alondra1-dev-setup.exe" | Out-File -Encoding ascii artifacts/Alondra1-dev-setup.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Alondra1-dev-setup
          path: |
            artifacts/Alondra1-dev-setup.exe
            artifacts/Alondra1-dev-setup.exe.sha256
          retention-days: 14
      # https://github.com/<owner>/alondra1-windows/releases/download/dev-latest/Alondra1-dev-setup.exe always serves
      # the newest Dev setup. Tags v* (prod) are separate and untouched.
      - name: Publish to dev-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/dev-latest -f sha="$GITHUB_SHA" >/dev/null
          notes="Alondra1 Dev for Windows, built from $GITHUB_SHA on $(date -u +%Y-%m-%d). Development and test version: it installs separately from Alondra1 (own data folder alondra1-dev under Local AppData) and talks to the Dev environment only. The setup is not code-signed yet, so Windows SmartScreen asks before running it (More info, Run anyway). SHA-256 in Alondra1-dev-setup.exe.sha256."
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest --prerelease --title "Alondra1 Dev (latest)" --notes "$notes"
          else
            gh release create dev-latest --prerelease --title "Alondra1 Dev (latest)" --notes "$notes" --verify-tag
          fi
          gh release upload dev-latest artifacts/Alondra1-dev-setup.exe artifacts/Alondra1-dev-setup.exe.sha256 --clobber

  prod-setup:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: The tag matches the installer version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not (Select-String -Path installer/alondra1.iss -Pattern "#define MyAppVersion `"$([regex]::Escape($version))`"" -Quiet)) {
            throw "Tag $version does not match MyAppVersion in installer/alondra1.iss."
          }
      - name: Build the prod setup (checked for dev endpoints)
        shell: pwsh
        run: ./installer/publish.ps1 -Environment prod
      - id: sum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/Alondra1-setup.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "Unsigned prod setup SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Alondra1-setup-unsigned
          path: artifacts/Alondra1-setup.exe
          retention-days: 7

  publish:
    needs: prod-setup
    runs-on: windows-latest
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Alondra1-setup-unsigned
          path: artifacts
      - name: The approved build, unchanged
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/Alondra1-setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ needs.prod-setup.outputs.sha256 }}") { throw "The setup changed after approval." }
      - name: Sign (prod identity only here) and verify
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { throw "No code-signing identity in the prod environment: refusing to publish an unsigned setup." }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 artifacts/Alondra1-setup.exe
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
            & $signtool.FullName verify /pa artifacts/Alondra1-setup.exe
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          (Get-FileHash artifacts/Alondra1-setup.exe -Algorithm SHA256).Hash.ToLower() + "  Alondra1-setup.exe" | Out-File -Encoding ascii artifacts/Alondra1-setup.exe.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" artifacts/Alondra1-setup.exe artifacts/Alondra1-setup.exe.sha256 --repo "${{ github.repository }}" --title "Alondra1 ${{ github.ref_name }}" --notes "Signed prod build; see docs/DELIVERY-NOTES.md. SHA-256 in Alondra1-setup.exe.sha256."
