<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://assets.alondra1.invalid data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Alondra1 note</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="a1-banner" role="status" hidden></div>
  <div class="a1-bars">
    <div id="a1-toolbar" role="toolbar" aria-label="Formatting"></div>
    <div id="a1-contextbars"></div>
  </div>
  <div id="a1-find" role="search" hidden>
    <input id="a1-find-input" type="search" placeholder="Find in note" aria-label="Find in note">
    <span id="a1-find-count" aria-live="polite"></span>
    <button type="button" class="a1-btn" id="a1-find-prev" aria-label="Previous match" title="Previous (Shift+Enter)"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m5 12 5-5 5 5"/></svg></button>
    <button type="button" class="a1-btn" id="a1-find-next" aria-label="Next match" title="Next (Enter)"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m5 8 5 5 5-5"/></svg></button>
    <button type="button" class="a1-btn" id="a1-find-close" aria-label="Close find" title="Close (Esc)"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
  </div>
  <main id="a1-page">
    <div id="a1-sheet">
      <input id="a1-title" type="text" placeholder="Title" aria-label="Note title" maxlength="300" autocomplete="off">
      <div id="a1-statusline"><span id="a1-status" role="status" aria-live="polite"></span></div>
      <div id="a1-doc"></div>
    </div>
  </main>
  <div id="a1-popover" role="dialog" hidden></div>
  <div id="a1-toast" role="alert" hidden></div>
  <script src="editor.js"></script>
</body>
</html>
